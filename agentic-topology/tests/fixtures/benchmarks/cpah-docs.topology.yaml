edges:
  - from: monitor_scan
    to: task_scheduler
    category: normal
    trigger: "目录扫描或 watcher 收到源文件事件"
    payloads:
      - info: info-01
        carrier: event
        delivered_at: "runtime 主循环收到消息并调用 handle_path 时"
      - info: info-02
        carrier: event
        delivered_at: "runtime 主循环处理 Reconcile 分支时"
    concurrency_control: "同一路径由 ActivePaths 合并 pending 请求并按优先级保留"
    confidence: certain
    source:
      refs:
        - "src-tauri/src/runtime.rs:102-115"
        - "src-tauri/src/runtime.rs:141-180"
      confirmed_at: "2026-08-27"

  - from: task_scheduler
    to: engine_choice
    category: normal
    trigger: "路径通过文件类型、扩展名、监控目录和去重检查并写入 queued task"
    payloads:
      - info: info-03
        carrier: bundle
        delivered_at: "queue_task 返回任务并进入 process_path 时"
    concurrency_control: "同一路径只允许一个 running，重复请求放入 pending"
    confidence: certain
    source:
      refs:
        - "src-tauri/src/runtime.rs:390-464"
      confirmed_at: "2026-08-27"

  - from: engine_choice
