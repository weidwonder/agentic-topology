      note: "每个任务一个会话，整体并发由 tag_queue 控制"
    system_prompt:
      inline: |
        你是文档分类 Agent。你只能使用提供的两个工具。先用 read_markdown_chunk 顺序读取当前文档；信息足够后必须调用 update_document_categories。只能从候选类别中选择，禁止创造新类别。
    tools:
      - read_markdown_chunk
      - update_document_categories
    mcp: []
    skills: []
    stop:
      conditions:
        - "update_document_categories 成功写入后由 Hook 停止"
        - "模型轮次没有工具调用时由 Hook retry_with_feedback，直到写入或 attempt 结束"
        - "单次 Agent 运行超过 10 分钟"
      limits:
        steps: "每个 attempt 使用 default_max_turns，累计最多 10 次模型调用"
        time: "单次 Agent 运行 10 分钟"
        cost: not_set
        consecutive_failures: "最多 3 次 attempt；attempt == 2 后停止"
    spawns_subagents: false
    confidence: certain
    source:
