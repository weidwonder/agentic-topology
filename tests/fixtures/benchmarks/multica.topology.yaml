  - id: P3
    name: "任务取消侦听"
    kind: program
    responsibility: "handleTask 为本次任务起的后台 goroutine：定时（及收到 reconcile 广播时）调用 d.client.GetTaskStatus 查询任务是否已到终态或已被服务端删除；一旦判真，关闭 cancelled 通道，触发上层调用 runCancel() 中断仍在执行的一切（含正在跑的 Agent 子进程）"
    inputs: "task.ID、轮询间隔 pollInterval、reconcile 广播信号（WS 重连等事件）"
    outputs: "一次性的 cancelled 信号（channel close）"
    purpose: "在服务端已经判定任务结束（用户取消 / 任务被删除 / 服务端置为其它终态）时，把这个信号从服务端带外传回本地正在跑的一切，而不是等本地流程自然走完才发现白跑了"
    group: g3
    concurrency:
      default: 1
      max: 20
      note: "每个正在执行的任务各配一个 watcher goroutine，并发数与 P2 相同（同一个 MaxConcurrentTasks 池）"
