    outputs: "认领到的 Task 列表，每条已绑定一个 runtime_id 与一个执行槽位(slot)"
    purpose: "在 daemon 与服务端之间做批量认领与传输层降级协商，确保一次认领到的任务数不超过本机当前空闲槽位数，避免服务端派发的任务在本地无处可跑"
