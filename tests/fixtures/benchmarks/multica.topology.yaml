  - id: AGENT_BACKEND
    name: "CLI 编码 Agent（Claude / Codex）"
    kind: agent
    responsibility: |
      按 provider 参数把首轮用户消息发给对应的编码 CLI 子进程并驱动一次会话：
      provider=claude 时以 `claude -p --output-format stream-json
      --input-format stream-json --permission-mode bypassPermissions
      --disallowedTools AskUserQuestion` 非交互启动，首轮消息经 stdin 写入一
      个 stream-json 用户事件，逐行读取 stdout 上的 assistant/tool_use/
      tool_result/result 等事件；provider=codex 时以 `codex app-server
      --listen stdio://` 启动，通过 JSON-RPC（stdio）握手、开一个新 thread 或
      resume 一个既有 thread、提交一次 turn，同样把过程事件转成统一的
      Message 流。两者都不接收独立的“系统提示词”参数——运行时简报由范围外
      的 execenv.InjectRuntimeConfig 写进任务工作目录（CLAUDE.md /
      AGENTS.md），由 CLI 自己去读，daemon 侧的 opts.SystemPrompt 对这两个
      provider 始终留空（daemon.go:providerNeedsInlineSystemPrompt 只对
      openclaw/kimi/traecli/qwenpaw 四家内联）。取消（ctx 被上游 runCtx 取消，
      或 idle watchdog 触发）时对整个子进程组先 SIGTERM 再 SIGKILL。
      codex 后端自身还带一层与本节点判定为“同一个 Agent”无关的内部重试：仅
      对“初始化握手失败”或“模型目录刷新失败”这两类特定启动期故障，在同一次
      Execute 调用里最多再打开一次新进程重试（attempt 2/2），不算新会话/新
      节点（判据见节点粒度约定规则 2）。

      节点数留账（节点粒度约定〈到底看哪一段来分 Agent〉）：claude 与 codex
      是两个不同的 CLI 二进制、两套完全不同的协议实现（claude.go 的
      stream-json vs codex.go 的 app-server JSON-RPC），单看这一点像是
      "另一套客户端、另一条调用链"。但判据要求同时满足"那条链有自己的系统
      提示词常量"——本仓源码里两者都没有：搜过 claude.go 与 codex.go 全文，
      没有任何 --append-system-prompt / 内嵌 persona 字符串一类的自有系统
      提示词常量，两者的"运行时简报"都来自同一个范围外的
      execenv.InjectRuntimeConfig(workdir, provider, taskCtx) 调用点（仅文件
      名 CLAUDE.md/AGENTS.md 不同），且 ExecOptions.SystemPrompt 对两者都
      始终留空。按判据这仍是同一个 Agent 节点，provider 是参数。**如果不看
      判据、只按"是否另一套客户端协议"这个更粗的标准数，会得到 2 个节点**
      ——两个数都写在这里，供使用者按需改判；本次描述采用判据给出的数字：
      1 个 Agent 节点（provider 参数化）。
    inputs: "首轮用户消息 prompt 字符串、ExecOptions（模型、resume 会话 ID、思考等级、service tier、MCP 配置、超时与看门狗阈值、daemon 默认参数与 agent 自定义参数、工作目录等）"
    outputs: "流式 Message（status/text/thinking/tool-use/tool-result/error/log）+ 最终 Result（Status/Output/Error/SessionID/Usage/ResumeRejected）"
    concurrency:
      default: 20
      max: 20
      note: "并发数=MaxConcurrentTasks（默认 20）；每个并发任务各起一个独立子进程"
    system_prompt:
      file: "server/internal/daemon/prompt.go"
      from: 81
      to: 100
    tools: []
    mcp: []
    skills: []
    stop:
      conditions:
        - "整体墙钟超时：opts.Timeout（=daemon 配置 AgentTimeout，默认 0=不限），超时后对子进程组 SIGTERM→SIGKILL"
        - "daemon 侧 idle watchdog：静默（无新消息）超过 30 分钟（DefaultAgentIdleWatchdog）强制终止，重标记为 idle_watchdog；单个工具调用原地静默超过 2 小时（DefaultAgentToolWatchdog）视同静默，同样触发"
        - "仅 codex：单轮语义不活跃超过 10 分钟（defaultCodexSemanticInactivityTimeout）视为该轮失败；首轮完全无进展超过 60 秒（defaultCodexFirstTurnNoProgressTimeout）判定走内部重试；JSON-RPC 握手阶段超过 30 秒（defaultCodexHandshakeTimeout）判超时"
        - "正常结束：收到 result（claude）或 turn 完成事件（codex），经 stdin EOF/进程退出后返回最终 Result"
      limits:
        steps: not_set
        time: "见 stop.conditions；claude/codex 均未设置 --max-turns（opts.MaxTurns 从未被 daemon 赋值），故没有独立的“步数”上限，全部体现为时间类上限"
        cost: not_set
        consecutive_failures: "codex 后端对初始化握手失败/模型目录刷新失败这两类故障，同一次 Execute 内最多重试 1 次（2 次尝试）；claude 后端无内部重试。更外层“resume 被拒绝时清空会话重跑一次”记在 RUN_TASK→AGENT_BACKEND 这条边上，不在这里重复计"
    spawns_subagents: false
    confidence: certain
    field_confidence:
      tools: unread
      mcp: unread
      skills: unread
    # tools 为什么是 unread：claude/codex 的实际可用工具集（文件读写、
    #   bash、web 等）实现在 claude/codex 这两个外部二进制内部，不在
    #   multica 仓库任何位置；本仓源码唯一能确认的是 claude.go:729 那一条
    #   `--disallowedTools AskUserQuestion`（禁用，不是启用清单）。
    # mcp 为什么是 unread：完全是运行期动态数据，没有写死的固定清单——
    #   runtime_mcp.go:36-96(mergeRuntimeAndAgentMcpConfig) 把"本机已有的
    #   provider 原生 MCP 配置文件"(runtime_mcp.go:246-317) 与
    #   task.Agent.McpConfig(服务器下发，每个 agent 可不同) 合并后经
    #   --mcp-config(claude) / CODEX_HOME/config.toml(codex) 注入。
    # skills 为什么是 unread：同样是运行期数据——task.Agent.SkillRefs 由
    #   服务器按 agent 配置下发，daemon.go:5390-5456
    #   (ensureTaskSkillBundles) 按需下载到本地缓存(skill_cache.go)，具体
    #   有哪些 skill 因 agent/task 而异，源码里没有固定清单。
    source:
      refs:
        - "server/pkg/agent/agent.go:16-110"
        - "server/pkg/agent/agent.go:328-375"
        - "server/pkg/agent/claude.go:39-368"
        - "server/pkg/agent/claude.go:717-776"
        - "server/pkg/agent/codex.go:820-1000"
        - "server/pkg/agent/codex.go:263-286"
      confirmed_at: "2026-08-28"

edges:
  - from: POLL_DISPATCH
    to: HANDLE_TASK
    category: normal
    trigger: "runBatchPoller 一次批量申领拿到任务后，为每个任务分配一个并发槽位并各起一个 goroutine 调用 handleTask"
    carrier: bundle
    payloads:
      - content: "单个 Task 结构体（含 Agent 定义、Repos、触发评论/聊天/quick-create/autopilot 等全部上下文字段）及分配到的并发槽位 slot"
        produced_at: "ClaimTasksWSFirst/ClaimTasks 从服务器批量申领返回时"
        delivered_at: "runBatchPoller 起 goroutine 调用 d.handleTask(parentCtx, t, slot) 时"
    concurrency_control: "按并发槽位数量排队；槽位耗尽时下一轮申领会先阻塞等待空槽（最多等 taskSlotWaitTimeout=2s，超时则退避重试）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4423-4448"
      confirmed_at: "2026-08-28"

  - from: HANDLE_TASK
    to: POLL_DISPATCH
    category: normal
    trigger: "handleTask 对应的 goroutine 执行完毕，无论任务最终是完成、失败还是被取消"
    carrier: event
    payloads:
      - content: "释放回信号量的并发槽位 + 一次 wakeup 信号（催促 runBatchPoller 不必等 PollInterval 就立刻再申领一轮）"
        produced_at: "handleTask 返回时"
        delivered_at: "runBatchPoller 派发时注册的 deferred 回调里（sem <- slot; signalPollerWakeup(wakeup)）"
    concurrency_control: "信号量天然去重；wakeup channel 是容量 1 的非阻塞 channel，多次释放只会保留一次待处理的唤醒"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4437-4448"
      confirmed_at: "2026-08-28"

  - from: HANDLE_TASK
    to: RUN_TASK
    category: normal
    trigger: |
      runtime 存活校验通过，且（若任务命中 local_directory 项目资源）已经拿
      到对应路径的互斥锁。与此同时 HANDLE_TASK 起的后台协程会持续轮询服务器
      任务状态；一旦服务器侧任务转入终止态或任务行被删除，会经同一个 runCtx
      取消这次调用（带外信号，见 HANDLE_TASK 节点 responsibility）。
    carrier: bundle
    payloads:
      - content: "Task、provider、并发槽位 slot、task 专属 logger、可取消的 runCtx"
        produced_at: "handleTask 完成 runtime 校验与本地目录锁获取之后"
        delivered_at: "调用 d.runner.run(runCtx, task, provider, slot, taskLog) 时"
    concurrency_control: "不会发生（每个 handleTask 实例只调用一次 runTask，重试发生在 RUN_TASK 内部，不重新经过这条边）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4703-4706"
      confirmed_at: "2026-08-28"

  - from: RUN_TASK
    to: HANDLE_TASK
    category: normal
    trigger: "runTask 返回（正常产出结果、或在真正调用 Agent 之前的准备阶段就失败、或被 HANDLE_TASK 的取消协程经 runCtx 中断）"
    carrier: bundle
    payloads:
      - content: "TaskResult（Status/Comment/SessionID/WorkDir/Usage/FailureReason 等）"
        produced_at: "runTask 把 agent.Result 分类完毕时"
        delivered_at: "函数返回值"
      - content: "error（仅当尚未产出 TaskResult 就失败：如任务缺 workspace_id、鉴权 token 无效、skill bundle 下载失败、执行环境准备失败）"
        produced_at: "runTask 准备阶段任意一步失败时"
        delivered_at: "函数返回值"
    concurrency_control: "不会发生（一次同步调用一次返回）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4708-4750"
      confirmed_at: "2026-08-28"

  - from: RUN_TASK
    to: BUILD_PROMPT
    category: normal
    trigger: "每次真正要调用 Agent 之前都会先拼一次首轮消息——首次调用一次，若触发“清空会话重试”还会再拼一次全新的（不带 resume 提示）"
    carrier: bundle
    payloads:
      - content: "Task（此时 PriorSessionID 等字段仍是任务原始值）、provider"
        produced_at: "runTask 首次进入执行阶段时"
        delivered_at: "调用 BuildPrompt(task, provider) 时"
      - content: "Task（PriorSessionID 已被清空、PriorSessionResumeUnavailable 置 true）、provider"
        produced_at: "runTask 判定需要清空会话重试时（shouldRetryWithFreshSession 命中）"
        delivered_at: "调用 BuildPrompt(task, provider) 第二次时"
    concurrency_control: "不会发生（同一个 goroutine 内顺序调用）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:6007"
        - "server/internal/daemon/daemon.go:6373"
      confirmed_at: "2026-08-28"

  - from: BUILD_PROMPT
    to: RUN_TASK
    category: normal
    trigger: "BuildPrompt 每次调用都同步返回"
    carrier: bundle
    payloads:
      - content: "拼装完成的首轮用户消息字符串"
        produced_at: "BuildPrompt 返回时"
        delivered_at: "同一行赋值给 runTask 内的 prompt/freshPrompt 变量"
    concurrency_control: "不会发生"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:6007"
      confirmed_at: "2026-08-28"

  - from: RUN_TASK
    to: AGENT_BACKEND
    category: normal
    trigger: |
      拿到首轮用户消息后即调用 agent.Backend.Execute。同一条边覆盖两种触发：
      首次调用（可能带 ResumeSessionID，即请求 resume 既有会话）；以及命中
      shouldRetryWithFreshSession（resume 被拒绝/历史不可重放，且这次尝试
      未调用过任何工具）时，清空 ResumeSessionID、以全新会话重新调用一次
      （失败回灌：把上一次"resume 失败"的结论体现为这一次不再请求 resume）。
      调用期间若 HANDLE_TASK 的取消协程或 daemon 侧 idle watchdog 触发，会经
      同一个可取消的 ctx 中断这次调用（带外信号，说明见 AGENT_BACKEND.stop 与
      HANDLE_TASK 节点）。
    carrier: bundle
    payloads:
      - content: "首轮用户消息 prompt、ExecOptions（模型/思考等级/service tier/MCP 配置/超时与看门狗阈值/工作目录/daemon 默认参数与 agent 自定义参数），ResumeSessionID 非空"
        produced_at: "runTask 首次组装 ExecOptions 时"
        delivered_at: "调用 backend.Execute(agentCtx, prompt, opts) 时（经 executeAndDrain 包一层：驱动流式消息转发与 idle watchdog）"
      - content: "同上，但 ResumeSessionID 清空、ResumeExpected/ResumeContinuityNotice 改为反映“恢复失败”"
        produced_at: "runTask 判定需要清空会话重试时"
        delivered_at: "第二次调用 backend.Execute 时"
    concurrency_control: "不会发生（同一个 goroutine 内先后至多两次同步调用，不并发）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:6317-6323"
        - "server/internal/daemon/daemon.go:6353-6386"
        - "server/internal/daemon/daemon.go:6788-6810"
      confirmed_at: "2026-08-28"

  - from: AGENT_BACKEND
    to: RUN_TASK
    category: normal
    trigger: "每次 backend.Execute 会话结束（正常产出结果 / 超时 / 被上游 ctx 取消 / idle watchdog 强制终止）"
    carrier: bundle
    payloads:
      - content: "流式 Message（text/thinking/tool-use/tool-result/status/error/log），供 executeAndDrain 边收边转发给服务器（ReportTaskMessages）"
        produced_at: "Agent 会话进行中随事件产生"
        delivered_at: "session.Messages channel 持续推送，executeAndDrain 每 500ms 或收到即批量上报"
      - content: "最终 agent.Result（Status/Output/Error/SessionID/Usage/ResumeRejected）"
        produced_at: "Agent 会话结束时（claude 的 result 事件 / codex 的 turn 完成，或被 idle watchdog / ctx 取消强制中止）"
        delivered_at: "session.Result channel 送出一次；executeAndDrain 收到后返回给 runTask"
    concurrency_control: "不会发生"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:6788-7060"
        - "server/pkg/agent/agent.go:125-158"
      confirmed_at: "2026-08-28"
