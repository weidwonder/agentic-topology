graph:
  topology: fixed_workflow
  context_sharing: isolated
  entry: |
    daemon 是一个常驻进程。Daemon.Run(ctx)（daemon.go:1657）启动多个后台循环，
    其中 pollLoop（daemon.go:4292）唤醒 runBatchPoller（daemon.go:4350）持续向
    Multica 后端服务器（SaaS，本次范围外）批量申领处于 dispatched 状态的任务
    （ClaimTasksWSFirst，wsrpc.go:315，回退到 client.go:236 的 HTTP 批量申领）。
    每领到一个任务即分配一个并发槽位、起一个 goroutine 调用 handleTask
    （daemon.go:4613），进入这条链路（对应节点 POLL_DISPATCH）。
    本次只画"一个任务从被申领到产出结果"这一条链路，不画 daemon 启动时的
    runtime 注册 / 心跳 / workspace 同步 / 自动更新 / GC 等后台循环——它们不
    产生或消费这条链路上的任务数据，见范围边界说明。
  exits:
    - name: "任务完成"
      kind: normal
      condition: "runTask 判定 agent 执行结果 Status==completed，且输出不匹配已知的“摆烂式兜底”标记（classifyPoisonedOutput），reportTaskResult 走 CompleteTask 回调"
      source:
        refs:
          - "server/internal/daemon/daemon.go:6455-6480"
          - "server/internal/daemon/daemon.go:4989-5006"
          - "server/internal/daemon/client.go:373-392"
        confirmed_at: "2026-08-28"
    - name: "任务失败/被打回"
      kind: abnormal
      condition: "agent 执行超时（timeout）、静默超过 idle watchdog 阈值被强制终止、CLI 报错，或虽然 completed 但内容命中已知的兜底失败标记；这些都被 runTask 统一映射成 TaskResult.Status==blocked，reportTaskResult 走 FailTask 回调，并附带 taskfailure 分类后的 failure_reason"
      source:
        refs:
          - "server/internal/daemon/daemon.go:6484-6560"
          - "server/internal/daemon/daemon.go:5045-5072"
          - "server/internal/daemon/client.go:402-423"
