    kind: program
    responsibility: "handleTask：校验认领到的任务目标 runtime 仍被本机持有，获取本地目录锁（local_directory 项目资源场景）、标记活跃执行环境根目录，起一个取消侦听 goroutine（P3），调用 runTask（P4）执行，随后按结果决定回报或丢弃（被取消时丢弃），并落一份 GC 元数据"
    inputs: "P1 派发来的单个 Task、绑定的执行槽位 slot"
    outputs: "调用 P4 得到的 TaskResult（连同任务是否被中途取消的判定），以及写入磁盘的 GC 元数据"
    purpose: "把一次任务认领转成一次可安全中断、可回报终态的本地执行，处理 runtime 掉线、任务被服务端取消等边界情形，避免用一个空 provider 的 Runtime 跑出误导性的失败原因"
    group: g1
    concurrency:
