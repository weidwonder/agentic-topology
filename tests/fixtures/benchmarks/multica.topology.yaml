          - "server/internal/daemon/daemon.go:1720-1727"
        confirmed_at: "2026-08-27"

groups:
  - id: g1
    name: "启动与唤醒"
    order: 1
  - id: g2
    name: "领取与准备"
    order: 2
  - id: g3
    name: "提示词与执行"
    order: 3
  - id: g4
    name: "收尾与回报"
    order: 4

nodes:
  - id: startup
    name: "daemon 启动与预检"
    kind: program
    responsibility: "绑定健康端口、解析认证、预检并注册运行时，启动后台循环"
    inputs: "daemon 配置、认证令牌、已安装的 agent CLI"
    outputs: "已就绪 daemon、已注册 runtime、任务唤醒通道"
    purpose: "建立可领取任务的运行时边界，并在预检失败时阻止进入任务循环"
    group: g1
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:1656-1754"
      confirmed_at: "2026-08-27"

  - id: wakeup
    name: "WebSocket 唤醒与 reconcile 信号"
    kind: program
    responsibility: "读取 task_available、pending_work、runtime 变更和心跳事件并唤醒轮询器"
    inputs: "WebSocket 帧、重连事件、reconcile 广播"
    outputs: "taskWakeups 或 poller nudge 信号"
    purpose: "让任务领取和取消检查在事件到达时立即重查，同时保留轮询兜底"
    group: g1
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/wakeup.go:369-445"
        - "server/internal/daemon/reconcile.go:79-98"
      confirmed_at: "2026-08-27"

  - id: claim_dispatch
    name: "批量 claim 与并发槽分发"
    kind: program
    responsibility: "获取空闲槽位，跨 runtime 批量 ClaimTasks，并为每个任务启动 handleTask"
    inputs: "runtime 集合、唤醒信号、MaxConcurrentTasks"
    outputs: "带 slot 的并发任务执行 goroutine"
    purpose: "在 daemon 级并发上限内领取任务，避免无容量时产生服务端 dispatched 堆积"
    group: g2
    concurrency:
      default: 1
      max: 1
      note: "单个批量 poller；任务并发由其分配的 slot 控制"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4292-4457"
        - "server/internal/daemon/client.go:226-250"
      confirmed_at: "2026-08-27"

  - id: cancel_watch
    name: "任务状态取消监视"
    kind: program
    responsibility: "在 Agent 运行期间轮询任务状态，并响应终态或任务删除信号取消上下文"
    inputs: "task ID、run context、reconcile/ticker 信号"
    outputs: "cancelled 通道和 runCancel 调用"
    purpose: "把服务端的取消、重分配和删除带外信号传入本地 Agent 执行"
    group: g2
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4559-4610"
        - "server/internal/daemon/daemon.go:4702-4725"
      confirmed_at: "2026-08-27"

