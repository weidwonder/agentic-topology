        produced_at: "服务端认领响应解析完成时"
        delivered_at: "runBatchPoller 为其分配 slot 并起一个 goroutine 调用 d.handleTask 时"
      - content: "执行槽位编号 slot"
        produced_at: "waitForTaskSlot/drainAvailableSlots 从槽位信号量取出时"
        delivered_at: "与 Task 一起传给 d.handleTask"
    concurrency_control: "每个 slot 独占一份任务；一次批量 claim 请求的任务数不超过当前空闲 slot 数"
