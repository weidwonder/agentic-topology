    - name: "任务被取消"
      kind: cancelled
      condition: "handleTask 起的后台协程 watchTaskCancellation 轮询服务器发现该任务已在服务器侧进入终止态，或任务行被整体删除（404），daemon 关闭 cancelled channel、取消本次执行、丢弃本次 runTask 的结果、只调用 AckTaskCancelled 通知服务器完成收尾，不走 complete/fail 回调"
      source:
        refs:
          - "server/internal/daemon/daemon.go:4563-4611"
          - "server/internal/daemon/daemon.go:4732-4750"
          - "server/internal/daemon/client.go:345-348"
        confirmed_at: "2026-08-28"

groups: []

nodes:
  - id: POLL_DISPATCH
    name: "申领并派发任务"
    kind: program
    responsibility: |
      常驻轮询 Multica 后端服务器：按当前空闲并发槽数一次性批量申领最多同等
      数量的待办任务，再把每个申领到的任务连同一个并发槽位分发进独立
      goroutine 交给 handleTask。外层 pollLoop 本身不做申领，只用一个
      wakeup channel 催促内层 runBatchPoller 立刻再跑一轮（runtime 集合变化
      / 任务结束释放槽位时）；两者合成一个节点，因为 pollLoop 产出的只是
      "现在该再跑一轮了"这个信号，没有外部可单独指认的输入输出（节点粒度
      约定规则 1）。
    inputs: "本机已注册的 runtime ID 列表、当前空闲的并发槽位（信号量，容量=MaxConcurrentTasks）"
    outputs: "已申领的 Task 列表，每个都配好了一个并发槽位，交给 handleTask 的 goroutine"
    purpose: "把“该不该去要新任务”（有没有空槽、有没有 runtime）与“要到之后怎么跑”解耦：先占槽再申领，任务永远不会卡在服务器侧 dispatched 状态却本地没有运力去跑；一次批量申领覆盖这台机器上的全部 runtime，避免逐个 runtime 轮询的排队效应"
    concurrency:
      default: 1
      note: "整个 daemon 进程只有一条申领循环；它派发出的并发任务数上限由并发槽信号量决定，见 HANDLE_TASK 的 concurrency"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:1657-1751"
        - "server/internal/daemon/daemon.go:4292-4335"
        - "server/internal/daemon/daemon.go:4350-4459"
      confirmed_at: "2026-08-28"

  - id: HANDLE_TASK
    name: "单任务生命周期把关"
    kind: program
    responsibility: |
      对每个申领到的任务做前置校验与执行期把关：确认任务指向的 runtime 仍在
      本机（不在则直接判 runtime_offline 回报失败重试）；若任务的
      project_resource 里有 pin 在本机的 local_directory，取该路径的互斥锁
      （拿不到就先把任务状态标成 waiting_local_directory 再阻塞等待）；起一个
      后台协程 watchTaskCancellation 按固定间隔轮询服务器任务状态，一旦服务
      器侧任务已终止或该任务行被删除，就关闭 cancelled channel 并调用
      runCancel()，经同一个可取消的 runCtx 一路向下打断 RUN_TASK 里正在进行
      的 Agent 调用（这是一条“带外信号”：发起方是 HANDLE_TASK 自己起的协程，
      不是 RUN_TASK/Agent 主动让出控制权，按抽取纪律记在这里而不单独成边/成
      节点）；随后调用 RUN_TASK 拿到 TaskResult；把 usage 和最终结果回报给
      服务器；写 GC 元数据供后续 GC 循环回收工作目录（GC 循环本身在范围外）。
    inputs: "单个已申领的 Task 结构体、分配的并发槽位 slot"
    outputs: "TaskUsageEntry 用量回报（ReportTaskUsage）、对应的 CompleteTask/FailTask 回调、AckTaskCancelled（被取消时）、GC 元数据文件"
    purpose: "把“这个任务还该不该继续跑”的全部旁路判断（runtime 掉线、本地目录锁、服务器侧取消/删除）集中在这一层，让 RUN_TASK 只需要专心把一次 Agent 调用编排好"
    concurrency:
      default: 20
      max: 20
      note: "并发数=MaxConcurrentTasks，默认值 20（可用 MULTICA_DAEMON_MAX_CONCURRENT_TASKS 覆盖），config.go:67,327；每个申领到的任务各占一个并发槽位、各起一个 goroutine"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4613-4614"
        - "server/internal/daemon/daemon.go:4563-4611"
        - "server/internal/daemon/daemon.go:4844-4988"
        - "server/internal/daemon/daemon.go:4989-5082"
        - "server/internal/daemon/daemon.go:5083-5104"
      confirmed_at: "2026-08-28"

  - id: BUILD_PROMPT
    name: "拼首轮用户消息"
    kind: program
    responsibility: |
      按任务类型（聊天会话 / 评论触发 / autopilot run-only / quick-create /
      默认的指派型任务）分别拼出这一轮要发给 Agent 的首轮用户消息正文，再统
      一在末尾追加运行期上下文块（会话连续性提示、触发者信息块、已连接应用
      列表——这几块之所以放进首轮消息尾部而不是常驻的系统提示词文件，是因
      为它们逐轮都可能变化，若混进系统提示词会打掉 Claude Code 的 prompt
      缓存前缀）。刻意保持精简：详细的规则性指令（怎么读评论、怎么回复、
      status 该怎么流转）不在这里，而是由范围外的 execenv.InjectRuntimeConfig
      写进任务工作目录里的 CLAUDE.md / AGENTS.md 等运行时简报文件，由 Agent
      CLI 自己去读（见 AGENT_BACKEND 节点与核对清单“系统提示词在范围外”条）。
    inputs: "Task 全量字段（触发评论/聊天消息/quick-create 原文/autopilot 描述等）、provider 名字符串"
    outputs: "拼装完成的首轮用户消息字符串"
    purpose: "把“这一轮要不要现在说的话”（触发上下文、恢复提示）和“这个 Agent 一直都该遵守的规则”（运行时简报，范围外）分开产出，分开投递"
    concurrency:
      default: 20
      max: 20
      note: "在调用方 RUN_TASK 的同一个 goroutine 内同步执行，并发数与 RUN_TASK 一致（=MaxConcurrentTasks）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/prompt.go:81-129"
        - "server/internal/daemon/prompt.go:138-240"
        - "server/internal/daemon/prompt.go:241-336"
        - "server/internal/daemon/prompt.go:428-563"
        - "server/internal/daemon/prompt.go:568-596"
      confirmed_at: "2026-08-28"

  - id: RUN_TASK
    name: "单任务执行编排"
    kind: program
    responsibility: |
      单个任务的核心编排：解析 provider 对应的 CLI 可执行文件路径（含自愈重
      新解析、自定义 runtime profile 覆盖）；确保该 agent 引用的 skill bundle
      已下载到本地缓存（ensureTaskSkillBundles，命中缓存或按需下载，产出只
      在本函数内部被后续用到，未被外部代码单元读取，按节点粒度约定规则 1 不
      单独成节点）；调用范围外的 execenv 包准备/复用隔离执行环境（工作目录、
      MCP 配置文件、CODEX_HOME 等——execenv 包整体在本次范围外，见范围边界，
      这里读不到环境到底是怎么搭起来的）；调 BUILD_PROMPT 拿首轮用户消息；
      组装 ExecOptions（模型、thinking level、service tier、MCP 配置、daemon
      默认参数与 agent 自定义参数、是否需要把运行时简报内联进 SystemPrompt 字
      段——只有 openclaw/kimi/traecli/qwenpaw 四家需要，claude 与 codex 都不
      需要，见 providerNeedsInlineSystemPrompt）；调用 AGENT_BACKEND 执行并
      拿到流式消息与最终 Result；当且仅当“请求 resume 但被拒绝（或历史不可
      重放）且这次尝试没有调用过任何工具”时，清空会话 ID、重新走一次
      BUILD_PROMPT、以全新会话再调用一次 AGENT_BACKEND（失败回灌：把“resume
      失败”这个结构化结论重新喂回下一次调用，但目标还是同一个 AGENT_BACKEND
      节点，按同向合并规则记在同一条边上，不新开边）；最终把 agent.Result 分
      类成 TaskResult（completed / blocked 及具体 failure_reason / cancelled）。
    inputs: "Task、provider 字符串、并发槽位 slot、可取消的 runCtx（由 HANDLE_TASK 传入，HANDLE_TASK 的取消协程可经它中断本节点及其下游的 Agent 调用）"
    outputs: "TaskResult（状态、评论文本、branch_name、session_id、work_dir、usage、failure_reason 等）或 error（仅当在真正调用 Agent 之前的准备阶段失败，如鉴权 token 无效、环境准备失败）"
    purpose: "把“怎么把一个任务变成一次 Agent 调用、调用失败了要不要换个干净会话重来一次、Agent 的原始结果该归类成哪种任务终态”这三件事收在一处，作为 HANDLE_TASK 与 AGENT_BACKEND 之间的编排层"
    concurrency:
      default: 20
      max: 20
      note: "并发数=MaxConcurrentTasks（默认 20），每个并发任务各自跑一份"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:5609-6009"
        - "server/internal/daemon/daemon.go:6006-6317"
        - "server/internal/daemon/daemon.go:6317-6386"
        - "server/internal/daemon/daemon.go:6660-6710"
        - "server/internal/daemon/daemon.go:6386-6659"
      confirmed_at: "2026-08-28"

  - id: AGENT_BACKEND
    name: "CLI 编码 Agent（Claude / Codex）"
    kind: agent
    responsibility: |
      按 provider 参数把首轮用户消息发给对应的编码 CLI 子进程并驱动一次会话：
      provider=claude 时以 `claude -p --output-format stream-json
      --input-format stream-json --permission-mode bypassPermissions
      --disallowedTools AskUserQuestion` 非交互启动，首轮消息经 stdin 写入一
      个 stream-json 用户事件，逐行读取 stdout 上的 assistant/tool_use/
      tool_result/result 等事件；provider=codex 时以 `codex app-server
      --listen stdio://` 启动，通过 JSON-RPC（stdio）握手、开一个新 thread 或
      resume 一个既有 thread、提交一次 turn，同样把过程事件转成统一的
      Message 流。两者都不接收独立的“系统提示词”参数——运行时简报由范围外
      的 execenv.InjectRuntimeConfig 写进任务工作目录（CLAUDE.md /
      AGENTS.md），由 CLI 自己去读，daemon 侧的 opts.SystemPrompt 对这两个
      provider 始终留空（daemon.go:providerNeedsInlineSystemPrompt 只对
      openclaw/kimi/traecli/qwenpaw 四家内联）。取消（ctx 被上游 runCtx 取消，
      或 idle watchdog 触发）时对整个子进程组先 SIGTERM 再 SIGKILL。
      codex 后端自身还带一层与本节点判定为“同一个 Agent”无关的内部重试：仅
      对“初始化握手失败”或“模型目录刷新失败”这两类特定启动期故障，在同一次
      Execute 调用里最多再打开一次新进程重试（attempt 2/2），不算新会话/新
      节点（判据见节点粒度约定规则 2）。
    inputs: "首轮用户消息 prompt 字符串、ExecOptions（模型、resume 会话 ID、思考等级、service tier、MCP 配置、超时与看门狗阈值、daemon 默认参数与 agent 自定义参数、工作目录等）"
    outputs: "流式 Message（status/text/thinking/tool-use/tool-result/error/log）+ 最终 Result（Status/Output/Error/SessionID/Usage/ResumeRejected）"
    concurrency:
      default: 20
      max: 20
      note: "并发数=MaxConcurrentTasks（默认 20）；每个并发任务各起一个独立子进程"
    system_prompt:
      file: "server/internal/daemon/prompt.go"
      from: 81
      to: 100
    tools: []
    mcp: []
    skills: []
    stop:
      conditions:
        - "整体墙钟超时：opts.Timeout（=daemon 配置 AgentTimeout，默认 0=不限），超时后对子进程组 SIGTERM→SIGKILL"
        - "daemon 侧 idle watchdog：静默（无新消息）超过 30 分钟（DefaultAgentIdleWatchdog）强制终止，重标记为 idle_watchdog；单个工具调用原地静默超过 2 小时（DefaultAgentToolWatchdog）视同静默，同样触发"
        - "仅 codex：单轮语义不活跃超过 10 分钟（defaultCodexSemanticInactivityTimeout）视为该轮失败；首轮完全无进展超过 60 秒（defaultCodexFirstTurnNoProgressTimeout）判定走内部重试；JSON-RPC 握手阶段超过 30 秒（defaultCodexHandshakeTimeout）判超时"
        - "正常结束：收到 result（claude）或 turn 完成事件（codex），经 stdin EOF/进程退出后返回最终 Result"
      limits:
        steps: not_set
        time: "见 stop.conditions；claude/codex 均未设置 --max-turns（opts.MaxTurns 从未被 daemon 赋值），故没有独立的“步数”上限，全部体现为时间类上限"
        cost: not_set
        consecutive_failures: "codex 后端对初始化握手失败/模型目录刷新失败这两类故障，同一次 Execute 内最多重试 1 次（2 次尝试）；claude 后端无内部重试。更外层“resume 被拒绝时清空会话重跑一次”记在 RUN_TASK→AGENT_BACKEND 这条边上，不在这里重复计"
    spawns_subagents: false
    confidence: certain
    field_confidence:
      tools: unread
      mcp: unread
      skills: unread
    source:
      refs:
        - "server/pkg/agent/agent.go:16-110"
        - "server/pkg/agent/agent.go:328-375"
        - "server/pkg/agent/claude.go:39-368"
        - "server/pkg/agent/claude.go:717-776"
        - "server/pkg/agent/codex.go:820-1000"
        - "server/pkg/agent/codex.go:263-286"
      confirmed_at: "2026-08-28"

edges:
  - from: POLL_DISPATCH
    to: HANDLE_TASK
    category: normal
    trigger: "runBatchPoller 一次批量申领拿到任务后，为每个任务分配一个并发槽位并各起一个 goroutine 调用 handleTask"
    carrier: bundle
    payloads:
      - content: "单个 Task 结构体（含 Agent 定义、Repos、触发评论/聊天/quick-create/autopilot 等全部上下文字段）及分配到的并发槽位 slot"
        produced_at: "ClaimTasksWSFirst/ClaimTasks 从服务器批量申领返回时"
        delivered_at: "runBatchPoller 起 goroutine 调用 d.handleTask(parentCtx, t, slot) 时"
    concurrency_control: "按并发槽位数量排队；槽位耗尽时下一轮申领会先阻塞等待空槽（最多等 taskSlotWaitTimeout=2s，超时则退避重试）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4423-4448"
      confirmed_at: "2026-08-28"

  - from: HANDLE_TASK
    to: POLL_DISPATCH
    category: normal
    trigger: "handleTask 对应的 goroutine 执行完毕，无论任务最终是完成、失败还是被取消"
    carrier: event
    payloads:
      - content: "释放回信号量的并发槽位 + 一次 wakeup 信号（催促 runBatchPoller 不必等 PollInterval 就立刻再申领一轮）"
        produced_at: "handleTask 返回时"
        delivered_at: "runBatchPoller 派发时注册的 deferred 回调里（sem <- slot; signalPollerWakeup(wakeup)）"
    concurrency_control: "信号量天然去重；wakeup channel 是容量 1 的非阻塞 channel，多次释放只会保留一次待处理的唤醒"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4437-4448"
      confirmed_at: "2026-08-28"

  - from: HANDLE_TASK
    to: RUN_TASK
    category: normal
    trigger: |
      runtime 存活校验通过，且（若任务命中 local_directory 项目资源）已经拿
      到对应路径的互斥锁。与此同时 HANDLE_TASK 起的后台协程会持续轮询服务器
      任务状态；一旦服务器侧任务转入终止态或任务行被删除，会经同一个 runCtx
      取消这次调用（带外信号，见 HANDLE_TASK 节点 responsibility）。
    carrier: bundle
    payloads:
      - content: "Task、provider、并发槽位 slot、task 专属 logger、可取消的 runCtx"
        produced_at: "handleTask 完成 runtime 校验与本地目录锁获取之后"
        delivered_at: "调用 d.runner.run(runCtx, task, provider, slot, taskLog) 时"
    concurrency_control: "不会发生（每个 handleTask 实例只调用一次 runTask，重试发生在 RUN_TASK 内部，不重新经过这条边）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4703-4706"
      confirmed_at: "2026-08-28"

  - from: RUN_TASK
    to: HANDLE_TASK
    category: normal
    trigger: "runTask 返回（正常产出结果、或在真正调用 Agent 之前的准备阶段就失败、或被 HANDLE_TASK 的取消协程经 runCtx 中断）"
    carrier: bundle
    payloads:
      - content: "TaskResult（Status/Comment/SessionID/WorkDir/Usage/FailureReason 等）"
        produced_at: "runTask 把 agent.Result 分类完毕时"
        delivered_at: "函数返回值"
      - content: "error（仅当尚未产出 TaskResult 就失败：如任务缺 workspace_id、鉴权 token 无效、skill bundle 下载失败、执行环境准备失败）"
        produced_at: "runTask 准备阶段任意一步失败时"
        delivered_at: "函数返回值"
    concurrency_control: "不会发生（一次同步调用一次返回）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4708-4750"
      confirmed_at: "2026-08-28"

  - from: RUN_TASK
