        - "server/internal/daemon/daemon.go:4716-4723"
      confirmed_at: "2026-08-28"

  - id: P4
    name: "任务执行主控与结果分类"
    kind: program
    responsibility: |
      runTask：申请任务鉴权 token、组装 TaskContextForEnv 与执行参数，调用执行环境准备（P5）
      拿到隔离工作目录/CODEX_HOME 等；注入运行时简报（execenv.InjectRuntimeConfig，属于 P5
      范畴）；调用提示词组装（P6）拿到首轮任务消息；解析 provider 对应的 Agent 后端
      （agent.ResolveBackend，纯函数式查表，内联在本节点里，不单独成节点——见候选边界账）
      并调用它执行（对应 A1 / A2 之一）；executeAndDrain 承接该次调用：驱动消息 drain 循环、
      喂给闲置看门狗（P8）判活、并把消息流/session 落盘上报（对应到 P9 的一条独立边）；
      若首次结果显示 resume 被拒绝且本轮未观测到任何工具调用，重建冷启动上下文后发起唯一
      一次全新会话重试（同一条边上的第二个传递物，这就是本次专门找的“失败回灌边”）；
      最终把 agent.Result 分类为 completed / blocked(timeout/idle_watchdog/其它) / cancelled，
      构造 TaskResult 返回给 P2。
    inputs: "P2 传入的 task、provider、slot、runCtx"
    outputs: "TaskResult（Status/Comment/SessionID/WorkDir/EnvRoot/Usage/FailureReason 等）"
    purpose: "把一条 Task 记录变成一次真实的 Agent 会话调用，并把该次调用五花八门的结束方式（正常完成/超时/看门狗打断/被取消/resume 失败）统一收敛成服务端认识的几种终态"
    group: g3
    concurrency:
      default: 1
      max: 20
      note: "同 P2，同一个 MaxConcurrentTasks 池"
    confidence: certain
    field_confidence:
      concurrency.max: inferred
    source:
