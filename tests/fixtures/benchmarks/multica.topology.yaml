    kind: program
    responsibility: "按 SkillRef 读取缓存，逐个下载缺失 bundle，校验并写回缓存后装配到任务"
    inputs: "task.Agent.SkillRefs、workspace、runtime 和 task ID"
    outputs: "task.Agent.Skills 及其文件内容"
    purpose: "让隔离环境准备阶段获得任务声明的技能，并让成功下载可跨 dispatch 复用"
    group: g2
    concurrency:
      default: 1
