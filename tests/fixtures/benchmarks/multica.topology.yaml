nodes:
  - id: POLL_DISPATCH
    name: "申领并派发任务"
    kind: program
    responsibility: |
      常驻轮询 Multica 后端服务器：按当前空闲并发槽数一次性批量申领最多同等
      数量的待办任务，再把每个申领到的任务连同一个并发槽位分发进独立
      goroutine 交给 handleTask。外层 pollLoop 本身不做申领，只用一个
      wakeup channel 催促内层 runBatchPoller 立刻再跑一轮（runtime 集合变化
      / 任务结束释放槽位时）；两者合成一个节点，因为 pollLoop 产出的只是
      "现在该再跑一轮了"这个信号，没有外部可单独指认的输入输出（节点粒度
      约定规则 1）。
    inputs: "本机已注册的 runtime ID 列表、当前空闲的并发槽位（信号量，容量=MaxConcurrentTasks）"
    outputs: "已申领的 Task 列表，每个都配好了一个并发槽位，交给 handleTask 的 goroutine"
    purpose: "把“该不该去要新任务”（有没有空槽、有没有 runtime）与“要到之后怎么跑”解耦：先占槽再申领，任务永远不会卡在服务器侧 dispatched 状态却本地没有运力去跑；一次批量申领覆盖这台机器上的全部 runtime，避免逐个 runtime 轮询的排队效应"
    concurrency:
      default: 1
      note: "整个 daemon 进程只有一条申领循环；它派发出的并发任务数上限由并发槽信号量决定，见 HANDLE_TASK 的 concurrency"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:1657-1751"
        - "server/internal/daemon/daemon.go:4292-4335"
        - "server/internal/daemon/daemon.go:4350-4459"
      confirmed_at: "2026-08-28"

  - id: HANDLE_TASK
    name: "单任务生命周期把关"
    kind: program
    responsibility: |
      对每个申领到的任务做前置校验与执行期把关：确认任务指向的 runtime 仍在
      本机（不在则直接判 runtime_offline 回报失败重试）；若任务的
      project_resource 里有 pin 在本机的 local_directory，取该路径的互斥锁
      （拿不到就先把任务状态标成 waiting_local_directory 再阻塞等待）；起一个
      后台协程 watchTaskCancellation 按固定间隔轮询服务器任务状态，一旦服务
      器侧任务已终止或该任务行被删除，就关闭 cancelled channel 并调用
      runCancel()，经同一个可取消的 runCtx 一路向下打断 RUN_TASK 里正在进行
      的 Agent 调用（这是一条“带外信号”：发起方是 HANDLE_TASK 自己起的协程，
      不是 RUN_TASK/Agent 主动让出控制权，按抽取纪律记在这里而不单独成边/成
      节点）；随后调用 RUN_TASK 拿到 TaskResult；把 usage 和最终结果回报给
      服务器；写 GC 元数据供后续 GC 循环回收工作目录（GC 循环本身在范围外）。
    inputs: "单个已申领的 Task 结构体、分配的并发槽位 slot"
    outputs: "TaskUsageEntry 用量回报（ReportTaskUsage）、对应的 CompleteTask/FailTask 回调、AckTaskCancelled（被取消时）、GC 元数据文件"
    purpose: "把“这个任务还该不该继续跑”的全部旁路判断（runtime 掉线、本地目录锁、服务器侧取消/删除）集中在这一层，让 RUN_TASK 只需要专心把一次 Agent 调用编排好"
    concurrency:
      default: 20
      max: 20
      note: "并发数=MaxConcurrentTasks，默认值 20（可用 MULTICA_DAEMON_MAX_CONCURRENT_TASKS 覆盖），config.go:67,327；每个申领到的任务各占一个并发槽位、各起一个 goroutine"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/daemon.go:4613-4614"
        - "server/internal/daemon/daemon.go:4563-4611"
        - "server/internal/daemon/daemon.go:4844-4988"
        - "server/internal/daemon/daemon.go:4989-5082"
        - "server/internal/daemon/daemon.go:5083-5104"
      confirmed_at: "2026-08-28"

  - id: BUILD_PROMPT
    name: "拼首轮用户消息"
    kind: program
    responsibility: |
      按任务类型（聊天会话 / 评论触发 / autopilot run-only / quick-create /
      默认的指派型任务）分别拼出这一轮要发给 Agent 的首轮用户消息正文，再统
      一在末尾追加运行期上下文块（会话连续性提示、触发者信息块、已连接应用
      列表——这几块之所以放进首轮消息尾部而不是常驻的系统提示词文件，是因
      为它们逐轮都可能变化，若混进系统提示词会打掉 Claude Code 的 prompt
      缓存前缀）。刻意保持精简：详细的规则性指令（怎么读评论、怎么回复、
      status 该怎么流转）不在这里，而是由范围外的 execenv.InjectRuntimeConfig
      写进任务工作目录里的 CLAUDE.md / AGENTS.md 等运行时简报文件，由 Agent
      CLI 自己去读（见 AGENT_BACKEND 节点与核对清单“系统提示词在范围外”条）。
    inputs: "Task 全量字段（触发评论/聊天消息/quick-create 原文/autopilot 描述等）、provider 名字符串"
    outputs: "拼装完成的首轮用户消息字符串"
    purpose: "把“这一轮要不要现在说的话”（触发上下文、恢复提示）和“这个 Agent 一直都该遵守的规则”（运行时简报，范围外）分开产出，分开投递"
    concurrency:
      default: 20
      max: 20
      note: "在调用方 RUN_TASK 的同一个 goroutine 内同步执行，并发数与 RUN_TASK 一致（=MaxConcurrentTasks）"
    confidence: certain
    source:
      refs:
        - "server/internal/daemon/prompt.go:81-129"
        - "server/internal/daemon/prompt.go:138-240"
        - "server/internal/daemon/prompt.go:241-336"
        - "server/internal/daemon/prompt.go:428-563"
        - "server/internal/daemon/prompt.go:568-596"
