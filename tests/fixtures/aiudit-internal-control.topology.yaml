schema_version: 1
source_project: "~/projects/aiudit_platform"
generated_at: "2026-08-26"
analysis_complete: true

graph:
  topology: fixed_workflow
  context_sharing: isolated
  entry: "用户 Page3 编辑「审计重点」→ IPC audit:start → 材料索引就绪校验（或 audit:skip-indexing）→ engineHost.start + ensureAgentFsMcp → runInternalControlAudit"
  exits:
    - name: "成功"
      kind: normal
      condition: "汇总对账通过，报告落盘并广播完成"
      source:
        refs:
          - "workflow.ts:441-447"
        confirmed_at: "2026-08-26"
    - name: "规划失败"
      kind: abnormal
      condition: "台账连续 maxPlanAttempts(2) 次被六条硬校验判非法"
      source:
        refs:
          - "workflow.ts:586"
        confirmed_at: "2026-08-26"
    - name: "覆盖率失败"
      kind: abnormal
      condition: "台账 N 项与回执数不等，指名方面·阶段(itemId)"
      source:
        refs:
          - "reconcile.ts:62-76"
        confirmed_at: "2026-08-26"
    - name: "模型配置类错误"
      kind: abnormal
      condition: "isLlmConfigurationRetryError，置 fatalModelError 并取消整个 task"
      source:
        refs:
          - "workflow.ts:376-379"
        confirmed_at: "2026-08-26"
    - name: "用户取消"
      kind: cancelled
      condition: "audit:cancel 触发各段检查点的 throwIfCancelled"
      source:
        refs:
          - "ipc.ts:383"
        confirmed_at: "2026-08-26"

groups:
  - id: g1
    name: "定计划"
    order: 1
  - id: g2
    name: "分头干活"
    order: 2
  - id: g3
    name: "收尾"
    order: 3

nodes:
  - id: N1
    name: "材料清册与指纹"
    kind: program
    responsibility: "遍历三目录，算内容指纹、稳定排序、算材料集合指纹与审计重点指纹"
    inputs: "三个材料目录与审计重点"
    outputs: "MaterialEntry[]、材料集合指纹、审计重点指纹"
    purpose: "为台账复用与范围校验提供确定性基准"
    group: g1
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "material-inventory.ts:102-137"
      confirmed_at: "2026-08-26"
  - id: N2
    name: "台账复用查找"
    kind: program
    responsibility: "四元复用键比对历史台账，命中整份沿用"
    inputs: "材料集合指纹、审计重点指纹、路由与一致性信息"
    outputs: "沿用的 AuditLedger 或复用未命中结果"
    purpose: "冻结台账使二次运行不再重新规划"
    group: g1
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "ledger-store.ts:45-67"
      confirmed_at: "2026-08-26"
  - id: N3
    name: "材料分组与规划提示词构建"
    kind: program
    responsibility: "5000+ 份扁平材料收敛成目录级材料组（不下发指纹）；写 plan-input.json"
    inputs: "材料清册、词表、审计重点、searchPolicy、单项选组上限"
    outputs: "plan-input.json"
    purpose: "上下文瘦身，防规划者在 1.37MB 清单下编造指纹"
    group: g1
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "prompts.ts:80-110"
      confirmed_at: "2026-08-26"
  - id: N4
    name: "规划 Agent「内控审计规划师」"
    kind: agent
    responsibility: "审计重点落到 18 方面 × 2 阶段，选材料组，写 ledger.draft.json；拿不到材料正文"
    inputs: "plan-input.json、首轮用户消息、上轮结构化拒绝原因"
    outputs: "ledger.draft.json 与会话 finalText"
    group: g1
    concurrency:
      default: 1
    system_prompt:
      file: "assets/prompts/internal-control-planner.v2.md"
      from: 1
      to: 62
    tools:
      - read
      - write
      - edit
    mcp: []
    skills: []
    stop:
      conditions:
        - "写完 ledger.draft.json 并结束会话"
        - "整段重试上限 2 次"
      limits:
        steps: "会话轮次上限 80（注释自陈实测不约束工具循环，真实语义未读出）"
        time: not_set
        cost: not_set
        consecutive_failures: "整段重试 2 次"
    spawns_subagents: false
    confidence: certain
    field_confidence:
      stop.limits.steps: unread
    source:
      refs:
        - "engine-host.ts:1169-1181"
      confirmed_at: "2026-08-26"
  - id: N5
    name: "台账校验归一与落盘"
    kind: program
    responsibility: "六条硬校验；组号展开成指纹；算任务项 ID；补未纳入审查的方面；落盘 ledger.json"
    inputs: "ledger.draft.json"
    outputs: "AuditLedger、ledger.json 或六条结构化错误串"
    purpose: "作为覆盖率对账的甲方，任一校验命中即整份判非法"
    group: g1
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "ledger.ts:72-122"
      confirmed_at: "2026-08-26"
  - id: N6
    name: "工作项切分与滑动窗口调度"
    kind: program
    responsibility: "同方面两阶段合成一工作项；滑窗并发；断点续跑；卡死看门狗"
    inputs: "AuditLedger、ledger.json"
    outputs: "InternalControlWorkItem、WorkItemOutcome、补交提醒或取消信号"
    purpose: "控制并发、断点续跑，并在卡住时中止单项"
    group: g2
    concurrency:
      default: 3
      max: 4
      note: "网关天花板 4"
    confidence: certain
    source:
      refs:
        - "dispatch.ts:19-71"
      confirmed_at: "2026-08-26"
  - id: N7
    name: "判定工作项提示词构建"
    kind: program
    responsibility: "写 work-item.json；并入国家规范；解析允许引用范围；建路径白名单；逐字拼入 rubric"
    inputs: "InternalControlWorkItem、对应台账项、收窄投喂材料、全量清册"
    outputs: "work-item.json、首轮消息与判定提示词"
    purpose: "完成格式转换、范围收窄与判据注入"
    group: g2
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "prompts.ts:184-260"
        - "prompts.ts:354"
      confirmed_at: "2026-08-26"
  - id: N8
    name: "判定执行者「内控审计判定师」"
    kind: agent
    responsibility: "就本工作项 1–2 个任务项给结论（通过/问题/存疑）与理由、findings；不汇总不写报告不扩范围"
    inputs: "work-item.json、首轮消息、severity-rubric.v2.md、上轮 validationErrors、receiptTicketUrl"
    outputs: "receipts 数组与每条 finding 的引用"
    group: g2
    concurrency:
      default: 1
    system_prompt:
      file: "assets/prompts/internal-control-judge.v9.md"
      from: 1
      to: 192
    tools:
      - read
      - grep
      - todo_write
    mcp:
      - agent_fs
      - ic_receipt
    skills: []
    stop:
      conditions:
        - "主动调用 submit_receipt 提交回执"
        - "取证步数撞 400、同 attempt 退回撞 4 次或工作项重试达到 3 次"
        - "15 分钟无进展时由外层中止"
      limits:
        steps: "取证步数预算 400 次工具调用/attempt；maxTurns=80 的真实语义未读出"
        time: "15 分钟无进展"
        cost: not_set
        consecutive_failures: "同 attempt 内被闸门退回 4 次"
    spawns_subagents: false
    confidence: certain
    field_confidence:
      stop.limits.steps: unread
    source:
      refs:
        - "engine-host.ts:1185-1197"
      confirmed_at: "2026-08-26"
  - id: N9
    name: "回执三道闸门"
    kind: program
    responsibility: "依次执行契约层、检索层、引文层校验，接收合格回执或退回错误"
    inputs: "receipts、材料范围、允许引用范围"
    outputs: "accepted 回执、search_evidence、validationErrors"
    purpose: "把材料只读、范围不扩大、引文必落位变成代码边界"
    group: g2
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "workflow.ts:784-918"
      confirmed_at: "2026-08-26"
  - id: N10
    name: "汇总对账与报告渲染"
    kind: program
    responsibility: "台账↔回执逐项对账；去重、计数重算、重新编号；概要三段纯程序渲染"
    inputs: "全部 WorkItemOutcome、失败工作项错误明细、AuditLedger、indexingMode、embed"
    outputs: "报告与完成广播，或 InternalControlCoverageError"
    purpose: "覆盖率不由模型自述，并且不下总体健全性定性"
    group: g3
    concurrency:
      default: 1
    confidence: certain
    source:
      refs:
        - "reconcile.ts:45-140"
      confirmed_at: "2026-08-26"

